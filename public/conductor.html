<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conductor View - Visual Metronome</title>
  <link rel="stylesheet" href="conductor.css">
  <style>
    /* Video controls */
    .video-controls-btn {
      background: rgba(58, 123, 200, 0.3);
      border: 1px solid rgba(58, 123, 200, 0.6);
      color: white;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      margin-left: 10px;
    }

    .video-controls-btn:hover {
      background: rgba(58, 123, 200, 0.5);
    }

    .video-controls-panel {
      position: fixed;
      top: 70px;
      right: 20px;
      background: rgba(0, 0, 0, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 15px;
      z-index: 1000;
      min-width: 320px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s ease;
    }

    .video-controls-panel.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .video-controls-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .video-url-input {
      width: 100%;
      padding: 10px;
      background: #252525;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .video-controls-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .video-btn {
      flex: 1;
      padding: 10px;
      background: rgba(58, 123, 200, 0.3);
      border: 1px solid rgba(58, 123, 200, 0.6);
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .video-btn:hover {
      background: rgba(58, 123, 200, 0.5);
    }

    .video-btn.danger {
      background: rgba(200, 58, 58, 0.3);
      border-color: rgba(200, 58, 58, 0.6);
    }

    .video-btn.danger:hover {
      background: rgba(200, 58, 58, 0.5);
    }

    .video-opacity-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .video-opacity-control input[type="range"] {
      flex: 1;
    }
  </style>
</head>
<body>
  <!-- Video Background -->
  <video id="videoBackground" class="video-background" loop muted playsinline></video>

  <!-- Header Bar -->
  <div class="header-bar">
    <div class="status-section">
      <span class="status-indicator" id="statusIndicator">●</span>
      <span id="statusText">Disconnected</span>
    </div>
    <div class="song-info">
      <span>Song: <strong id="songName">--</strong></span>
      <button class="video-controls-btn" id="videoControlsBtn">Video Background</button>
    </div>
  </div>

  <!-- Video Controls Panel -->
  <div class="video-controls-panel" id="videoControlsPanel">
    <div class="video-controls-title">Video Background</div>
    <input type="text" class="video-url-input" id="videoUrlInput" placeholder="Enter video URL or file path">
    <div class="video-controls-buttons">
      <button class="video-btn" id="loadVideoBtn">Load</button>
      <button class="video-btn danger" id="clearVideoBtn">Clear</button>
    </div>
    <div class="video-opacity-control">
      <label>Opacity:</label>
      <input type="range" id="videoOpacity" min="0" max="100" value="20" step="5">
      <span id="videoOpacityValue">20%</span>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Left Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">
        <h2>SECTIONS</h2>
        <div class="show-bars-toggle">
          <label>
            <input type="checkbox" id="showAllBarsCheckbox">
            Show All Bars
          </label>
        </div>
        <div class="section-list" id="sectionList">
          <!-- Sections will be rendered here -->
        </div>
      </div>

      <div class="sidebar-section">
        <h2>VAMPS</h2>
        <div class="predefined-vamps" id="predefinedVamps">
          <!-- Predefined vamps will be rendered here -->
        </div>

        <div class="custom-vamp">
          <h3>Custom Vamp</h3>
          <div class="vamp-controls">
            <div class="control-row">
              <label>Start:</label>
              <select id="customVampStart"></select>
            </div>
            <div class="control-row">
              <label>End:</label>
              <select id="customVampEnd"></select>
            </div>
            <div class="control-row">
              <label>Safety:</label>
              <select id="customVampSafety">
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div>
          </div>
          <button class="btn btn-vamp" id="enableCustomVampBtn">ENABLE VAMP</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h2>TEMPO</h2>
        <div class="tempo-display" id="tempoDisplay">120 BPM</div>
        <div class="tempo-controls">
          <button class="btn btn-tempo" data-delta="-5">−5</button>
          <button class="btn btn-tempo" data-delta="-1">−1</button>
          <button class="btn btn-tempo" data-delta="0">RESET</button>
          <button class="btn btn-tempo" data-delta="1">+1</button>
          <button class="btn btn-tempo" data-delta="5">+5</button>
        </div>
      </div>
    </div>

    <!-- Center/Right Area -->
    <div class="main-area">
      <!-- Info Panel (top-right) -->
      <div class="info-panel">
        <div class="info-section" id="currentSection">--</div>
        <div class="info-bar" id="currentBar">Bar --</div>
        <div class="info-chords" id="currentChords">--</div>
        <div class="info-runtime" id="runtimeDisplay">00:00:00.00</div>
        <div class="info-time-sig" id="timeSignatureDisplay">4/4 @ 120 BPM</div>
      </div>

      <!-- Beat Indicators (centered) -->
      <div class="beat-indicators-container">
        <div class="beat-indicators" id="beatIndicators">
          <!-- Beat lights will be dynamically generated -->
        </div>
      </div>

      <!-- Progress line - vertical bar moving left to right -->
      <div class="progress-line" id="progressLine"></div>

      <!-- Vamp Active Banner -->
      <div class="vamp-banner" id="vampBanner" style="display: none;">
        <div class="vamp-banner-content">
          ⚠️ VAMP ACTIVE: <span id="vampBannerText">--</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Control Bar -->
  <div class="bottom-bar">
    <div class="transport-controls">
      <button class="btn btn-stop" id="stopBtn">
        <span class="btn-icon">◼</span>
        <span class="btn-label">STOP</span>
      </button>
      <button class="btn btn-play" id="playBtn">
        <span class="btn-icon">▶</span>
        <span class="btn-label">PLAY</span>
      </button>
      <button class="btn btn-pause" id="pauseBtn">
        <span class="btn-icon">⏸</span>
        <span class="btn-label">PAUSE</span>
      </button>
      <div class="song-selector-group">
        <select class="song-select" id="songSelect">
          <option value="">Select song...</option>
        </select>
        <button class="btn btn-next" id="nextSongBtn">
          <span class="btn-icon">⏭</span>
          <span class="btn-label">NEXT SONG</span>
        </button>
      </div>
    </div>

    <div class="vamp-transport-controls">
      <button class="btn btn-safety-bar" id="safetyBarBtn">
        <span class="btn-icon">🛡</span>
        <span class="btn-label">SAFETY BAR</span>
        <span class="safety-count" id="safetyCount" style="display: none;">0</span>
      </button>
      <button class="btn btn-end-vamp" id="endVampBtn">
        <span class="btn-icon">✕</span>
        <span class="btn-label">END VAMP</span>
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="conductor.js"></script>
</body>
</html>
